<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YTS Movie Selector</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --text: #e8eaf0; --muted: #9aa1ad; --accent: #01b4e4; --accent2: #16d3a2;
    --amber: #f5b942; --red: #e5484d; --green: #3dd68c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 10px 16px;
  }
  .headrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0 8px 0 0; white-space: nowrap; }
  h1 span { color: var(--accent); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex: 1; }
  input, select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; outline: none;
  }
  input { min-width: 220px; }
  input:focus, select:focus { border-color: var(--accent); }
  button {
    background: var(--accent); border: 0; color: #04222b; font-weight: 600;
    border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  button.danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
  .badge {
    display: inline-block; min-width: 34px; text-align: center; font-weight: 700;
    font-size: 12px; border-radius: 6px; padding: 2px 6px; color: #062012;
  }
  .b-high { background: var(--green); } .b-mid { background: var(--amber); } .b-low { background: var(--red); color: #fff; }
  main { padding: 14px 16px 60px; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  table { border-collapse: collapse; width: 100%; min-width: 1080px; }
  thead th {
    position: sticky; top: 0; background: var(--panel2); color: var(--muted);
    text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  tbody td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:hover { background: #1b1f29; }
  .poster { width: 96px; } .shot { width: 230px; }
  .poster img, .shot img {
    width: 100%; border-radius: 8px; display: block; background: var(--panel2);
    aspect-ratio: 2/3; object-fit: cover;
  }
  .shot img { aspect-ratio: 16/9; }
  .ph {
    width: 100%; aspect-ratio: 2/3; border-radius: 8px; background: var(--panel2);
    display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 22px;
  }
  .shot .ph { aspect-ratio: 16/9; font-size: 16px; }
  .carousel { position: relative; }
  .carousel .slide { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; background: var(--panel2); }
  .cnav {
    position: absolute; top: 50%; transform: translateY(-50%); width: 26px; height: 26px;
    padding: 0; border: 0; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff;
    font-size: 15px; font-weight: 400; line-height: 1; display: flex; align-items: center;
    justify-content: center; cursor: pointer;
  }
  .cnav:hover { background: rgba(0,0,0,.8); }
  .cprev { left: 6px; } .cnext { right: 6px; }
  .ccount {
    position: absolute; bottom: 6px; right: 8px; font-size: 11px; color: #fff;
    background: rgba(0,0,0,.55); border-radius: 6px; padding: 1px 6px; pointer-events: none;
  }
  .mtitle { font-weight: 700; font-size: 15px; }
  .meta { color: var(--muted); font-size: 12px; margin: 3px 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .chip {
    font-size: 11px; color: var(--accent); background: rgba(1,180,228,.1);
    border: 1px solid rgba(1,180,228,.35); padding: 1px 8px; border-radius: 99px;
  }
  .links a { color: var(--muted); font-size: 12px; margin-right: 10px; text-decoration: none; }
  .links a:hover { color: var(--accent); }
  .plot { color: #c6ccd6; font-size: 13px; max-width: 460px; }
  .clamped { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .torrents { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .pill {
    color: var(--text); text-decoration: none; font-size: 12px; font-weight: 600;
    background: var(--panel2); border: 1px solid var(--line); padding: 4px 10px;
    border-radius: 99px; cursor: pointer; text-align: left;
  }
  .pill:hover { border-color: var(--accent); color: var(--accent); }
  .pill.queued {
    background: rgba(22,211,162,.12); border-color: var(--accent2); color: var(--accent2);
  }
  #endStatus { text-align: center; color: var(--muted); padding: 18px 0 8px; font-size: 13px; }
  #endStatus button { margin-left: 8px; }
  #queueFab {
    position: fixed; bottom: 24px; right: 24px; z-index: 25;
    padding: 11px 18px; font-size: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
  }
  #queueFab:hover { transform: translateY(-1px); }
  #scrollSentinel { height: 2px; }
  #posterPreview {
    position: fixed; z-index: 40; display: none; pointer-events: none;
    border-radius: 10px; border: 1px solid var(--line);
    box-shadow: 0 12px 40px rgba(0,0,0,.6); background: var(--panel2);
  }
  #status { text-align: center; color: var(--muted); padding: 30px 0; }
  /* queue drawer */
  #drawer {
    position: fixed; top: 0; right: -380px; width: 360px; height: 100vh; z-index: 30;
    background: var(--panel); border-left: 1px solid var(--line); transition: right .2s ease;
    display: flex; flex-direction: column;
  }
  #drawer.open { right: 0; }
  .dhead { display: flex; align-items: center; justify-content: space-between; padding: 14px; border-bottom: 1px solid var(--line); }
  .dhead h2 { margin: 0; font-size: 15px; }
  #queueList { flex: 1; overflow-y: auto; padding: 10px 14px; }
  .qitem { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .qitem img { width: 42px; border-radius: 6px; aspect-ratio: 2/3; object-fit: cover; }
  .qinfo { flex: 1; min-width: 0; }
  .qtitle { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qmeta { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .status { font-size: 10px; font-weight: 700; text-transform: uppercase; border-radius: 5px; padding: 2px 6px; }
  .s-pending { background: rgba(245,185,66,.15); color: var(--amber); }
  .s-downloaded { background: rgba(61,214,140,.15); color: var(--green); }
  .qremove { background: none; border: 0; color: var(--muted); font-size: 15px; cursor: pointer; padding: 4px; }
  .qremove:hover { color: var(--red); }
  .dfoot { border-top: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .dfoot .row { display: flex; gap: 8px; }
  .dfoot code {
    font-size: 11px; color: var(--muted); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; word-break: break-all;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <div class="headrow">
    <h1>🎬 YTS <span>Movie Selector</span></h1>
    <div class="controls">
      <input id="search" placeholder="Search title, IMDb code, actor…" autofocus>
      <select id="genre"><option value="">Genre: all</option></select>
      <select id="minRating">
        <option value="0">Rating: any</option>
        <option value="6">6+</option><option value="7">7+</option>
        <option value="8">8+</option><option value="9">9+</option>
      </select>
      <select id="sortBy">
        <option value="date_added">Sort: newest</option>
        <option value="rating">Sort: rating</option>
        <option value="year">Sort: year</option>
        <option value="title">Sort: title</option>
        <option value="seeds">Sort: seeds</option>
        <option value="download_count">Sort: downloads</option>
        <option value="like_count">Sort: likes</option>
      </select>
      <button id="searchBtn">Search</button>
      <button id="queueBtn" class="ghost">Queue (<span id="queueCount" class="queueCountEl">0</span>)</button>
    </div>
  </div>
</header>

<main>
  <div id="status">Loading movies…</div>
  <div class="tablewrap hidden" id="tablewrap">
    <table>
      <thead><tr>
        <th class="poster">Poster</th><th>Movie</th><th>Plot</th>
        <th class="shot">Screencap</th><th>Queue by quality</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="endStatus" class="hidden"></div>
</main>

<button id="queueFab" title="Open the download queue">🧾 Queue <span class="queueCountEl" id="fabCount">0</span></button>

<aside id="drawer">
  <div class="dhead"><h2>Download queue</h2><button id="closeDrawer" class="ghost">✕</button></div>
  <div id="queueList"></div>
  <div class="dfoot">
    <div class="row">
      <button id="refreshQueue" class="ghost">Refresh</button>
      <button id="clearQueue" class="danger">Clear all</button>
    </div>
    <code>uv run python skills/yts/scripts/download_selected.py</code>
  </div>
</aside>

<script>
"use strict";

const YTS_HOSTS = ["https://yts.mx/api/v2", "https://yts.lt/api/v2",
  "https://yts.gg/api/v2", "https://movies-api.accel.li/api/v2"];
const GENRES = ["action","adventure","animation","biography","comedy","crime","documentary",
  "drama","family","fantasy","history","horror","music","mystery","romance","sci-fi",
  "sport","thriller","war","western"];
const LIMIT = 24;

const state = { page: 1, movieCount: 0, apiBase: null, selection: new Map(),
  useProxy: localStorage.getItem("ytsUseProxy") === "1",
  loadedMovies: [], loadingMovies: false, totalReached: false,
  pageCache: new Map(), prefetching: false };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- selection (backend) ---------- */

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(`${path} -> HTTP ${res.status}`);
  return res.json();
}

async function loadSelection() {
  const data = await api("/api/selection");
  state.selection = new Map(data.selected.map((m) => [m.id, m]));
  renderQueue();
}

async function queueMovie(movie, torrent) {
  // queue a specific quality: one torrent per queue entry
  const payload = {
    id: movie.id, imdb_code: movie.imdb_code,
    title: movie.title_english || movie.title, year: movie.year,
    rating: movie.rating, cover: movie.medium_cover_image,
    torrents: [{ quality: torrent.quality, hash: torrent.hash, url: torrent.url,
                 size: torrent.size, seeds: torrent.seeds }],
    quality: torrent.quality,
  };
  const data = await api("/api/selection", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload),
  });
  state.selection = new Map(data.selected.map((m) => [m.id, m]));
  renderQueue(); refreshQueueButtons(movie.id);
}

async function unqueueMovie(id) {
  const data = await api(`/api/selection/${id}`, { method: "DELETE" });
  state.selection = new Map(data.selected.map((m) => [m.id, m]));
  renderQueue(); refreshQueueButtons(id);
}

async function clearQueue() {
  if (!confirm("Remove all movies from the queue?")) return;
  const data = await api("/api/selection/clear", { method: "POST" });
  state.selection = new Map(data.selected.map((m) => [m.id, m]));
  renderQueue(); renderRows();
}

function renderQueue() {
  const items = [...state.selection.values()];
  document.querySelectorAll(".queueCountEl").forEach((el) => {
    el.textContent = items.length;
  });
  $("queueList").innerHTML = items.length ? items.map((m) => `
    <div class="qitem">
      ${m.poster ? `<img src="${esc(m.poster)}" alt="" loading="lazy">` : `<div class="ph">🎬</div>`}
      <div class="qinfo">
        <div class="qtitle">${esc(m.title)}</div>
        <div class="qmeta">${esc(m.year || "")} · ${m.quality
          ? esc(m.quality) + ((m.torrents || [])[0] ? " · " + esc(m.torrents[0].size || "") : "")
          : (m.torrents || []).length + " torrent(s)"}</div>
        <span class="status s-${esc(m.status)}">${esc(m.status)}</span>
      </div>
      <button class="qremove" data-id="${m.id}" title="Remove">✕</button>
    </div>`).join("")
    : `<div style="color:var(--muted);padding:20px 0;text-align:center">Queue is empty.<br>Select movies from the table.</div>`;
  document.querySelectorAll(".qremove").forEach((btn) =>
    btn.addEventListener("click", () => unqueueMovie(Number(btn.dataset.id))));
}

/* ---------- movies (YTS API, queried from the browser) ---------- */

function currentParams(page = state.page) {
  const params = new URLSearchParams({
    limit: String(LIMIT), page: String(page),
    sort_by: $("sortBy").value, order_by: "desc",
    with_images: "true", with_cast: "false",
  });
  const q = $("search").value.trim();
  if (q) params.set("query_term", q);
  if ($("genre").value) params.set("genre", $("genre").value);
  if ($("minRating").value !== "0") params.set("minimum_rating", $("minRating").value);
  return params;
}

async function ytsFetch(params) {
  // Direct browser fetch first (fast, no backend load); if the mirrors are
  // unreachable from this network, fall back to the backend, which proxies
  // through the SSH SOCKS tunnel pool.
  if (state.useProxy) {
    const res = await fetch(`/api/movies?${params}`);
    if (!res.ok) throw new Error(`backend proxy: HTTP ${res.status}`);
    const payload = await res.json();
    if (payload.error) throw new Error(payload.error);
    return payload.data;
  }
  const cached = localStorage.getItem("ytsApiBase");
  const candidates = cached
    ? [cached, ...YTS_HOSTS.filter(h => h !== cached)] : YTS_HOSTS;
  const tried = [];
  let lastErr = null;
  for (const base of candidates) {
    tried.push(new URL(base).hostname);
    try {
      const res = await fetch(`${base}/list_movies.json?${params}`, { signal: AbortSignal.timeout(5000) });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.status !== "ok") throw new Error(data.status || "bad response");
      state.apiBase = base;
      localStorage.removeItem("ytsUseProxy");
      localStorage.setItem("ytsApiBase", base);
      return data.data;
    } catch (err) { lastErr = err; }
  }
  // every direct candidate failed -> backend proxy (tunnel egress)
  try {
    const res = await fetch(`/api/movies?${params}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const payload = await res.json();
    if (payload.error) throw new Error(payload.error);
    state.useProxy = true;
    localStorage.setItem("ytsUseProxy", "1");
    return payload.data;
  } catch (proxyErr) { /* fall through to the combined error */ }
  const err = new Error(
    `YTS unreachable (${tried.join(", ")}) and backend proxy failed: ${lastErr ? lastErr.message : "unknown"}. ` +
    `The mirrors may be down; hit Retry.`);
  throw err;
}

function posterCell(m) {
  if (!m.medium_cover_image) return `<div class="ph">🎬</div>`;
  const large = m.large_cover_image || m.medium_cover_image;
  return `<img class="posterImg" src="${esc(m.medium_cover_image)}" alt=""
    loading="lazy" data-large="${esc(large)}"
    onerror="imgFallback(this, '${esc(m.medium_cover_image)}', '🎬')">`;
}

window.imgFallback = function (img, original, placeholder) {
  if (img.dataset.proxied) {
    img.outerHTML = `<div class="ph">${placeholder}</div>`;
    return;
  }
  img.dataset.proxied = "1";
  img.src = "/api/img?u=" + encodeURIComponent(original);
};

/* screenshot carousel: YTS hosts numbered stills per movie
   (medium-screenshot1/2/3.jpg) that the API does not expose; candidates that
   404 remove themselves from the carousel on first view */
function carouselHtml(shots) {
  if (!shots.length) return `<div class="ph">🖼</div>`;
  const slides = shots.map((u, i) => i === 0
    ? `<img class="slide" src="${esc(u)}" alt="" loading="lazy"
         onerror="slideError(this, '${esc(u)}')">`
    : `<img class="slide" style="display:none" data-src="${esc(u)}" alt=""
         onerror="slideError(this, '${esc(u)}')">`).join("");
  const nav = shots.length > 1 ? `
    <button class="cnav cprev" title="Previous screenshot">‹</button>
    <button class="cnav cnext" title="Next screenshot">›</button>
    <span class="ccount">1/${shots.length}</span>` : "";
  return `<div class="carousel">${slides}${nav}</div>`;
}

function screenshotUrls(m) {
  const folder = (m.background_image_original || m.background_image || "")
    .replace(/\/[^/]*$/, "");
  return [...new Set([
    m.background_image_original || m.background_image || "",
    folder ? `${folder}/medium-screenshot1.jpg` : "",
    folder ? `${folder}/medium-screenshot2.jpg` : "",
    folder ? `${folder}/medium-screenshot3.jpg` : "",
  ].filter(Boolean))];
}

function showSlide(carousel, idx) {
  const slides = [...carousel.querySelectorAll(".slide")];
  if (!slides.length) return;
  const cur = Math.max(0, slides.findIndex((s) => s.style.display !== "none"));
  const next = (idx + slides.length) % slides.length;
  slides.forEach((s, i) => { s.style.display = i === next ? "block" : "none"; });
  const target = slides[next];
  if (!target.getAttribute("src") && target.dataset.src) target.src = target.dataset.src;
  const count = carousel.querySelector(".ccount");
  if (count) count.textContent = `${next + 1}/${slides.length}`;
}

window.slideError = function (img, original) {
  const carousel = img.closest(".carousel");
  if (!carousel) return;
  if (!img.dataset.proxied) {
    img.dataset.proxied = "1";
    img.src = "/api/img?u=" + encodeURIComponent(original);
    return;
  }
  // dead slide even through the proxy: remove it and fix the carousel up
  const index = [...carousel.querySelectorAll(".slide")].indexOf(img);
  const wasVisible = img.style.display !== "none";
  img.remove();
  const slides = [...carousel.querySelectorAll(".slide")];
  if (!slides.length) {
    carousel.outerHTML = `<div class="ph">🖼</div>`;
    return;
  }
  carousel.querySelectorAll(".cnav").forEach((b) => {
    b.style.display = slides.length > 1 ? "" : "none";
  });
  const count = carousel.querySelector(".ccount");
  if (count) count.textContent = `${Math.min(index + 1, slides.length)}/${slides.length}`;
  if (wasVisible) showSlide(carousel, Math.min(index, slides.length - 1));
};

function appendMovies(data, reset) {
  state.movieCount = data.movie_count || 0;
  const movies = data.movies || [];
  state.loadedMovies.push(...movies);
  $("rows").insertAdjacentHTML("beforeend", movies.map(rowHtml).join(""));
  if (reset) {
    $("status").classList.add("hidden");
    $("tablewrap").classList.remove("hidden");
    if (!movies.length) {
      $("status").textContent = "No movies found.";
      $("status").classList.remove("hidden");
    }
  }
  if (state.loadedMovies.length >= state.movieCount) {
    state.totalReached = true;
    $("endStatus").textContent =
      `You've reached the end — ${state.loadedMovies.length} of ` +
      `${state.movieCount.toLocaleString()} movies loaded`;
  } else {
    $("endStatus").classList.add("hidden");
  }
}

function prefetchNext(attempt = 0) {
  // hydrate the next page in the background so scrolling never waits;
  // one silent retry covers transient tunnel flakes
  if (state.totalReached || state.prefetching) return;
  const next = state.page + 1;
  if (state.pageCache.has(next)) return;
  state.prefetching = true;
  ytsFetch(currentParams(next))
    .then((data) => {
      state.pageCache.set(next, data);
      state.prefetching = false;
    })
    .catch(() => {
      state.prefetching = false;
      if (attempt < 1) setTimeout(() => prefetchNext(attempt + 1), 1500);
      // after that, the live fetch on scroll handles it
    });
}

async function loadMovies(reset) {
  if (state.loadingMovies) return;
  if (!reset && state.totalReached) return;
  state.loadingMovies = true;
  if (reset) {
    state.page = 1;
    state.loadedMovies = [];
    state.totalReached = false;
    state.pageCache.clear();
    hidePosterPreview();
    $("rows").innerHTML = "";
    $("tablewrap").classList.add("hidden");
    $("endStatus").classList.add("hidden");
    $("status").textContent = "Loading movies…";
    $("status").classList.remove("hidden");
  } else if (state.pageCache.has(state.page)) {
    // prefetched page: render immediately, no network
    const cached = state.pageCache.get(state.page);
    state.pageCache.delete(state.page);
    appendMovies(cached, false);
    state.loadingMovies = false;
    prefetchNext();
    return;
  } else {
    $("endStatus").textContent = "Loading more…";
    $("endStatus").classList.remove("hidden");
  }
  try {
    const data = await ytsFetch(currentParams(state.page));
    appendMovies(data, reset);
    prefetchNext();
  } catch (err) {
    const retryHtml = ` <button onclick="loadMovies(${reset ? "true" : "false"})">Retry</button>`;
    if (reset) {
      $("status").innerHTML = `⚠️ ${esc(err.message)}<br><br>` +
        `<button onclick="loadMovies(true)">Retry</button>`;
    } else {
      $("endStatus").innerHTML = `⚠️ ${esc(err.message)}${retryHtml}`;
    }
  } finally {
    state.loadingMovies = false;
  }
}

function ratingBadge(rating) {
  const r = Number(rating) || 0;
  const cls = r >= 7.5 ? "b-high" : r >= 6 ? "b-mid" : "b-low";
  return `<span class="badge ${cls}">${r ? r.toFixed(1) : "N/A"}</span>`;
}

function rowHtml(m) {
  const title = m.title_english || m.title || `Movie ${m.id}`;
  const summary = (m.summary || m.description_intro || "").trim();
  const torrents = (m.torrents || []).filter((t) => t.hash);
  const sel = state.selection.get(m.id);
  const isQueued = (t) => !!(sel && (sel.quality
    ? sel.quality === t.quality
    : (sel.torrents || []).some((x) => x.hash === t.hash)));
  const torrentHtml = torrents.length ? torrents.map((t) => {
    const queued = isQueued(t);
    const label = `${t.quality} · ${t.size || "?"}`;
    return `<button class="pill queueQuality ${queued ? "queued" : ""}"
        data-id="${m.id}" data-quality="${esc(t.quality)}" data-label="${esc(label)}"
        title="Click to ${queued ? "remove from" : "add to"} the queue · seeds ${esc(t.seeds ?? "?")}">
        ${queued ? "✓" : "＋"} ${esc(label)}</button>`;
  }).join("")
    : `<span style="color:var(--muted)">No torrents</span>`;
  return `<tr data-id="${m.id}">
    <td class="poster">${posterCell(m)}</td>
    <td style="min-width:220px">
      <div class="mtitle">${esc(title)}</div>
      <div class="meta">${esc(m.year || "?")} · ${esc(m.runtime ? m.runtime + " min" : "—")}
        ${m.mpa_rating ? "· " + esc(m.mpa_rating) : ""} &nbsp; ${ratingBadge(m.rating)}</div>
      <div class="chips">${(m.genres || []).map((g) => `<span class="chip">${esc(g)}</span>`).join("")}</div>
      <div class="links">
        <a href="${esc(m.url || "#")}" target="_blank" rel="noopener">YTS ↗</a>
        ${m.imdb_code ? `<a href="https://www.imdb.com/title/${esc(m.imdb_code)}/" target="_blank" rel="noopener">IMDb ↗</a>` : ""}
      </div>
    </td>
    <td><div class="plot clamped" title="${esc(summary)}">${esc(summary) || "—"}</div></td>
    <td class="shot">${carouselHtml(screenshotUrls(m))}</td>
    <td><div class="torrents">${torrentHtml}</div></td>
  </tr>`;
}

function refreshQueueButtons(id) {
  const sel = state.selection.get(id);
  document.querySelectorAll(`button.queueQuality[data-id="${id}"]`).forEach((btn) => {
    const queued = !!(sel && sel.quality === btn.dataset.quality);
    btn.textContent = (queued ? "✓" : "＋") + " " + btn.dataset.label;
    btn.classList.toggle("queued", queued);
  });
}

/* ---------- wiring ---------- */

$("searchBtn").addEventListener("click", () => loadMovies(true));
$("search").addEventListener("keydown", (e) => { if (e.key === "Enter") loadMovies(true); });
$("genre").innerHTML = `<option value="">Genre: all</option>` +
  GENRES.map((g) => `<option value="${g}">${g}</option>`).join("");

// quality pills (queue/unqueue that torrent) + carousel arrows via event
// delegation (works for infinite-scrolled rows too)
$("rows").addEventListener("click", (e) => {
  const nav = e.target.closest("button.cnav");
  if (nav) {
    const carousel = nav.closest(".carousel");
    const slides = [...carousel.querySelectorAll(".slide")];
    const cur = Math.max(0, slides.findIndex((s) => s.style.display !== "none"));
    showSlide(carousel, cur + (nav.classList.contains("cnext") ? 1 : -1));
    return;
  }
  const qbtn = e.target.closest("button.queueQuality");
  if (qbtn) {
    const id = Number(qbtn.dataset.id);
    const movie = state.loadedMovies.find((m) => m.id === id);
    if (!movie) return;
    const torrent = (movie.torrents || []).find((t) => t.quality === qbtn.dataset.quality);
    if (!torrent) return;
    const sel = state.selection.get(id);
    if (sel && sel.quality === qbtn.dataset.quality) unqueueMovie(id);
    else queueMovie(movie, torrent);
  }
});

// poster hover preview
$("rows").addEventListener("mouseover", (e) => {
  const img = e.target.closest("img.posterImg");
  if (img) showPosterPreview(img);
});
$("rows").addEventListener("mouseout", (e) => {
  if (e.target.closest("img.posterImg")) hidePosterPreview();
});
window.addEventListener("scroll", hidePosterPreview, true);
window.addEventListener("wheel", hidePosterPreview, { passive: true });

/* poster hover preview: floating enlarged cover, hidden on mouse-out,
   scroll, or wheel */
const posterPreview = document.createElement("img");
posterPreview.id = "posterPreview";
document.body.appendChild(posterPreview);

function hidePosterPreview() {
  posterPreview.style.display = "none";
  posterPreview.dataset.for = "";
}

function positionPosterPreview(img) {
  const r = img.getBoundingClientRect();
  const vw = Math.max(window.innerWidth, document.documentElement.clientWidth || 0, 1000);
  const vh = Math.max(window.innerHeight, document.documentElement.clientHeight || 0, 600);
  const w = Math.min(340, Math.max(260, r.width * 3));
  const h = w * 1.5; // 2:3 poster aspect
  let left = r.right + 10;
  if (left + w > vw - 8) left = r.left - w - 10;
  if (left < 8) left = Math.max(8, (vw - w) / 2);
  let top = r.top + r.height / 2 - h / 2;
  top = Math.max(8, Math.min(top, vh - h - 8));
  posterPreview.style.left = Math.round(left) + "px";
  posterPreview.style.top = Math.round(top) + "px";
  posterPreview.style.width = w + "px";
}

function showPosterPreview(img) {
  const key = img.dataset.large || img.currentSrc || img.src;
  const shown = img.currentSrc || img.src; // cached medium -> instant preview
  if (posterPreview.dataset.for === key && posterPreview.style.display === "block") return;
  posterPreview.dataset.for = key;
  posterPreview.src = shown;
  posterPreview.style.display = "block";
  positionPosterPreview(img);
  if (key !== shown) {
    // sharpen: swap in the large cover once it loads (proxy fallback too)
    const pre = new Image();
    pre.onload = () => { if (posterPreview.dataset.for === key) posterPreview.src = key; };
    pre.onerror = () => {
      if (posterPreview.dataset.for !== key) return;
      fetch("/api/img?u=" + encodeURIComponent(key))
        .then((res) => { if (!res.ok) throw new Error(res.status); return res.blob(); })
        .then((blob) => {
          if (posterPreview.dataset.for === key) posterPreview.src = URL.createObjectURL(blob);
        })
        .catch(() => { /* keep the medium preview */ });
    };
    pre.src = key;
  }
}

// infinite scroll: a sentinel after the table triggers the next page via
// IntersectionObserver, plus a lightweight poll as a safety net for
// environments where observers/scroll events are not delivered
function maybeLoadMore() {
  if (state.loadingMovies || state.totalReached) return;
  if ($("tablewrap").classList.contains("hidden")) return;
  state.page += 1;
  loadMovies(false);
}

const sentinel = document.createElement("div");
sentinel.id = "scrollSentinel";
document.querySelector("main").appendChild(sentinel);
const pageObserver = new IntersectionObserver((entries) => {
  if (entries.some((e) => e.isIntersecting)) maybeLoadMore();
}, { rootMargin: "800px" });
pageObserver.observe(sentinel);

setInterval(() => {
  if (state.loadingMovies || state.totalReached) return;
  const rect = sentinel.getBoundingClientRect();
  const viewportH = Math.max(window.innerHeight,
    document.documentElement.clientHeight || 0, 600);
  if (rect.top < viewportH + 800) maybeLoadMore();
}, 1200);

$("queueBtn").addEventListener("click", () => $("drawer").classList.add("open"));
$("queueFab").addEventListener("click", () => $("drawer").classList.add("open"));
$("closeDrawer").addEventListener("click", () => $("drawer").classList.remove("open"));
$("clearQueue").addEventListener("click", clearQueue);
$("refreshQueue").addEventListener("click", loadSelection);

loadSelection().then(() => loadMovies(true)).catch((err) => {
  $("status").innerHTML =
    `⚠️ Failed to start: ${esc(err.message)}<br><br><button onclick="loadMovies(true)">Retry</button>`;
});
</script>
