[project]
name = "ai-agents"
version = "0.1.0"
description = "A collection of AI agent skills for managing media libraries and automating workflows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fast-agent-mcp",
    "mcp[cli]",
    "plexapi",
    "python-dotenv",
    "requests",
    "starlette",
    "uvicorn",
    "psycopg2-binary",
    "pandas",
    "pymongo",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "google-api-python-client",
    "httplib2",
    "pillow",
    "mutagen>=1.47.0",
    "playwright>=1.57.0",
    "aioaudiobookshelf>=0.1.10",
    "libgen-api-modern>=1.0.0",
    "qbittorrent-api>=2025.11.1",
    "nyaapy>=0.7.0",
    "pyYify>=1.7",
    "jellyfin-apiclient-python>=1.11.0",
    "libgen-api-enhanced>=1.2.4",
    "openpyxl>=3.1.5",
    "yfinance>=1.1.0",
    "numpy>=2.3.5",
    "scipy>=1.17.0",
]
